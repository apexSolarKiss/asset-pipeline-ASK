    co_location_note: >
      selection_rationale (makes-true) and governance_record co-locate here, as they do in SKU and
      collection mode. The shape does not preclude separation (campaign-mode evidence separated upstream
      authorship from the seam record).

    # quarantined legacy worked-substrate provenance — NOT link keys, NOT package content:
    legacy_worked_substrate:
