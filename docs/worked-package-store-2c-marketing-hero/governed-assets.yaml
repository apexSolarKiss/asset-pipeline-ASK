    selection_rationale: >
      "this is better, approved" — the prompt-remediated take is defensible where the earlier ones were
      only 'ok'. Composition failures resolved: a clean light-wood ledge parallel to the wall (the
      orthogonal-bench problem gone), the robe softly draped with the towels rather than hung on a hook,
