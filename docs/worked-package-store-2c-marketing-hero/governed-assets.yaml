      Governs the take true to creative_intent within the bounded_creative_discretion aperture on
      PKT-MSG-HG-001. Produced entirely in-base (Gemini 3 Pro Image -> slot candidate -> internal
      attachment-copy); no external transport — a genuine prototype-generated output, not an imported
