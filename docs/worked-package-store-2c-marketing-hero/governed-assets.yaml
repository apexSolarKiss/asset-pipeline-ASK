# selected_candidate is the SUBSTRATE-NEUTRAL link (a candidate key), replacing Airtable's
# source_attachment_id. In this package selection and governance CO-LOCATE in one record;
# campaign mode may separate them, so the shape does not preclude separation.

governed_assets:
  - id: ASSET-MSG-HG-001-HERO-001
    of_slot: SLOT-MSG-HG-001-HERO
    role: message_hero
    status: governed_output
    curator: ASK (marketing curator-of-record)
    captured_at: 2026-06-10
    curation_pattern: authorship-bearing      # curator ranged the full candidate space, not confirming a default
    no_external_import: true                  # produced in-base end to end; a prototype OUTPUT, not an imported input

    selected_candidate: CAND-MSG-HG-001-HERO-POST-01   # -> candidates.yaml ; the substrate-neutral selection link
